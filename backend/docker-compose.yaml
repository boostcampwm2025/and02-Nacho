services:
  db:
    image: mysql:8.4
    container_name: mysql_db_${SERVER_PORT}
    restart: always
    env_file:
      - .env
    ports:
      - "${DB_PORT}:3306"

  app:
    build: .
    container_name: spring_app_${SERVER_PORT}
    restart: always
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_db_${SERVER_PORT}:3306/andlife?serverTimezone=UTC
    depends_on:
      - db