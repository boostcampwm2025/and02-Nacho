name: 서버 배포 자동화

on:
  push:
    branches: [ "dev" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "dev" ]
    types: [ closed ]
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: JDK 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'